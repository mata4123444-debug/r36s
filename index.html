
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>تنبيه - الخدمة غير متوفرة</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, #263c61 0, transparent 35%),
                radial-gradient(circle at 85% 80%, #34274e 0, transparent 35%),
                #101827;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .background-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            pointer-events: none;
            opacity: 0.12;
        }

        .circle-one {
            width: 280px;
            height: 280px;
            background: #f59e0b;
            top: -100px;
            right: -80px;
        }

        .circle-two {
            width: 350px;
            height: 350px;
            background: #6366f1;
            bottom: -150px;
            left: -100px;
        }

        header {
            width: 100%;
            padding: 25px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: 800;
            color: #fff;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            font-size: 22px;
            box-shadow: 0 5px 20px #6366f155;
        }

        .status {
            font-size: 13px;
            color: #fbbf24;
            background: #fbbf2415;
            border: 1px solid #fbbf2433;
            padding: 7px 15px;
            border-radius: 30px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px 70px;
            position: relative;
            z-index: 1;
        }

        .card {
            width: 100%;
            max-width: 570px;
            padding: 45px 40px;
            text-align: center;
            border-radius: 25px;
            background: linear-gradient(
                145deg,
                rgba(255,255,255,0.09),
                rgba(255,255,255,0.035)
            );
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            backdrop-filter: blur(18px);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 105px;
            height: 105px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.25);
            box-shadow: 0 0 40px rgba(245,158,11,0.08);
        }

        .icon-container svg {
            width: 52px;
            height: 52px;
            stroke: #fbbf24;
        }

        .tag {
            display: inline-block;
            color: #fbbf24;
            background: rgba(245,158,11,0.1);
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 29px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
        }

        .description {
            font-size: 16px;
            line-height: 2.1;
            color: #c3ccdc;
            margin-bottom: 25px;
        }

        .description strong {
            color: #fff;
            font-weight: 700;
        }

        .divider {
            height: 1px;
            background: linear-gradient(
                to left,
                transparent,
                rgba(255,255,255,0.15),
                transparent
            );
            margin: 25px 0;
        }

        .thanks {
            font-size: 15px;
            color: #d8deeb;
        }

        .heart {
            color: #fb7185;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #77849a;
            font-size: 12px;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .logo {
                font-size: 17px;
            }

            .status {
                font-size: 11px;
                padding: 6px 10px;
            }

            main {
                padding: 25px 16px 45px;
            }

            .card {
                padding: 35px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .description {
                font-size: 14px;
            }

            .icon-container {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <header>
        <div class="logo">
            <div class="logo-icon">✦</div>
            <span>مركز الدعم</span>
        </div>

        <div class="status">
            ● تحديث الخدمة
        </div>
    </header>

    <main>
        <section class="card">

            <div class="icon-container">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke-width="1.7"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 9v4"/>
                    <path d="M12 17h.01"/>
                    <path d="M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
                </svg>
            </div>

            <span class="tag">تنبيه بخصوص الأداة</span>

            <h1>الأداة غير متوفرة حاليًا</h1>

            <p class="description">
                نعتذر لحضرتك، الأداة أصبحت غير متوفرة حاليًا،
                حيث تم إزالتها من قِبل المطور، وبالتالي مش هتقدر
                تستخدمها في الوقت الحالي.
            </p>

            <div class="divider"></div>

            <p class="thanks">
                شكرًا لتفهمك
                <span class="heart">♥</span>
            </p>

        </section>
    </main>

    <footer class="footer">
        جميع الحقوق محفوظة © 2026
    </footer>

</body>
</html>
